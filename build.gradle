plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.136'
}

version = mod_version
group = mod_group_id

base {
    archivesName = "${mod_id}-${mod_version}-neoforge-${minecraft_version}"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories {
    maven {
        url = 'https://cursemaven.com'
        content { includeGroup 'curse.maven' }
    }
}

neoForge {
    version = project.neo_version

    runs {
        client { client() }
        server { server() }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

dependencies {
    // Thaumaturge is All Rights Reserved: compile against it, never shade or commit it.
    if (project.findProperty('thaumaturge_file_id')) {
        compileOnly "curse.maven:thaumaturge-1628024:${project.thaumaturge_file_id}"
        runtimeOnly "curse.maven:thaumaturge-1628024:${project.thaumaturge_file_id}"
    } else {
        compileOnly fileTree(dir: 'libs', include: '*.jar')
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
    // No mixin annotation processor: the mod targets Mojang-named classes only, so it needs no refmap.
    options.compilerArgs << '-proc:none'
}

jar {
    from('LICENSE') { rename { "LICENSE_${mod_id}" } }
    manifest {
        attributes([
                'Implementation-Title'  : 'Aspect Interpreter',
                'Implementation-Version': mod_version,
                'Implementation-Vendor' : 'k1ngofpentacles',
        ])
    }
}
