name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # Thaumaturge can't be committed (All Rights Reserved), so CI fetches it from CurseForge's Maven
      # mirror. This needs thaumaturge_file_id set in gradle.properties.
      - name: Check Thaumaturge dependency is configured
        id: dep
        run: |
          if grep -Eq '^thaumaturge_file_id=[0-9]+' gradle.properties; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::thaumaturge_file_id is empty in gradle.properties; skipping the build."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: gradle/actions/setup-gradle@v4
        if: steps.dep.outputs.ok == 'true'
        with:
          gradle-version: 8.14.3

      - name: Build
        if: steps.dep.outputs.ok == 'true'
        run: gradle build --no-daemon

      - uses: actions/upload-artifact@v4
        if: steps.dep.outputs.ok == 'true'
        with:
          name: aspect-interpreter
          path: build/libs/*.jar
